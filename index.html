
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoFlow - AI Task Timer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                950: '#020617',
              }
            },
            backgroundImage: {
              'dot-pattern': "radial-gradient(#cbd5e1 1px, transparent 1px)",
              'dot-pattern-dark': "radial-gradient(#1e293b 1px, transparent 1px)",
            }
          }
        }
      }
    </script>
    <style type="text/css">
      /* 基础重置与全局样式 (替代 @layer base) */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f8fafc; /* bg-slate-50 */
        color: #0f172a; /* text-slate-900 */
        overflow: hidden;
        transition: background-color 0.2s, color 0.2s;
      }

      html.dark body {
        background-color: #020617; /* bg-slate-950 */
        color: #f8fafc; /* text-slate-100 */
      }
      
      /* 初始状态背景点阵 */
      body {
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 24px 24px;
      }

      html.dark body {
        background-image: radial-gradient(#1e293b 1px, transparent 1px);
      }

      /* 滚动条美化 */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #1e293b;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: #6366f1;
        border-radius: 10px;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "socket.io-client": "https://esm.sh/socket.io-client@^4.8.3",
        "express": "https://esm.sh/express@^5.2.1",
        "http": "https://esm.sh/http@^0.0.1-security",
        "socket.io": "https://esm.sh/socket.io@^4.8.3",
        "fs": "https://esm.sh/fs@^0.0.1-security",
        "path": "https://esm.sh/path@^0.12.7",
        "cors": "https://esm.sh/cors@^2.8.5",
        "url": "https://esm.sh/url@^0.11.4",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "recharts": "https://esm.sh/recharts@^3.6.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
        "vitest": "https://esm.sh/vitest@^4.0.17",
        "vitest/": "https://esm.sh/vitest@^4.0.17/",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
        "vite": "https://esm.sh/vite@^7.3.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
