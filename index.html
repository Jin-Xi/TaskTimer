
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChronoFlow - AI Task Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                950: '#020617',
              }
            },
            backgroundImage: {
              'dot-pattern': "radial-gradient(#cbd5e1 1px, transparent 1px)",
              'dot-pattern-dark': "radial-gradient(#1e293b 1px, transparent 1px)",
            }
          }
        }
      }
    </script>
    <style type="text/css">
      /* 基础重置与预览环境闪烁优化 */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: 'Inter', sans-serif;
      }
      
      /* 初始状态背景，防止加载闪烁 */
      body {
        background-color: #f8fafc; /* bg-slate-50 */
        background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
        background-size: 24px 24px;
      }

      html.dark body {
        background-color: #020617 !important; /* bg-slate-950 */
        background-image: radial-gradient(#1e293b 1px, transparent 1px);
      }

      /* 滚动条美化 */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #1e293b;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.562.0",
        "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2",
        "vite": "https://aistudiocdn.com/vite@^7.3.0",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.34.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.3/",
        "react/": "https://aistudiocdn.com/react@^19.2.3/",
        "react": "https://aistudiocdn.com/react@^19.2.3",
        "recharts": "https://aistudiocdn.com/recharts@^3.6.0",
        "vitest": "https://aistudiocdn.com/vitest@^4.0.16",
        "vitest/": "https://aistudiocdn.com/vitest@^4.0.16/"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
