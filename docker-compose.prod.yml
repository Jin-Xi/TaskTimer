version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: chronoflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: chronoflow_root_password
      MYSQL_DATABASE: chronoflow
      MYSQL_USER: chronoflow
      MYSQL_PASSWORD: chronoflow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    image: ghcr.io/jin-xi/tasktimer-backend:latest
    container_name: chronoflow_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://chronoflow:chronoflow_password@mysql:3306/chronoflow
      SECRET_KEY: change-this-in-production-use-openssl-rand-hex-32
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:8000,https://jinxtimeflow.top
      DEBUG: false
      # AI Configuration (Cloud mode)
      AI_PROVIDER: deepseek
      AI_API_KEY: ""
      AI_MODEL: deepseek-chat
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro

volumes:
  mysql_data:
