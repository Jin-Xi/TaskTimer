name: CI/CD Pipeline

on:
  push:
    branches:
      - openclaw_branch
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jin-xi/tasktimer-backend

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: |
          echo "VITE_API_URL=/api" > .env.production
          npm run build

      - name: Deploy frontend to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/usr/share/nginx/html/tasktimer/"
          strip_components: 1

  build-and-deploy-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy backend to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 登录 GitHub 容器库
            podman login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            # 拉取最新镜像
            podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            # 强制用新镜像重启后端容器
            cd /root/TaskTimer_full
            # 修改 docker-compose.yml 让它使用拉下来的远程镜像而不是本地 build
            sed -i 's|    build:|    #build:|g' docker-compose.yml
            sed -i 's|      context: ./backend|    image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest|g' docker-compose.yml
            sed -i 's|      dockerfile: Dockerfile|    #dockerfile: Dockerfile|g' docker-compose.yml
            podman-compose up -d backend
