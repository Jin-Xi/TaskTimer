version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: chronoflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: chronoflow_root_password
      MYSQL_DATABASE: chronoflow
      MYSQL_USER: chronoflow
      MYSQL_PASSWORD: chronoflow_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chronoflow_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://chronoflow:chronoflow_password@mysql:3306/chronoflow
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production-use-openssl-rand-hex-32}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8000}
      DEBUG: ${DEBUG:-false}
      # AI Configuration (Cloud mode)
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      AI_BASE_URL: ${AI_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Development Server (for development only)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: chronoflow_frontend
    restart: always
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./:/app
      - /app/node_modules
    command: npm run dev --host

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: chronoflow_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    profiles:
      - production

volumes:
  mysql_data:
